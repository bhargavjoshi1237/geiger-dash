# Sends each push's commits to Geiger Dash, which has an LLM write and publish the changelog entry.
# To reuse in another product repo: copy this file and change PRODUCT (and the branch if it isn't master).
# Needs repo secret CHANGELOG_INGEST_SECRET; optional repo variable GEIGER_DASH_URL (default https://geiger.studio).
# Add [skip changelog] to a commit message to leave that commit out.
name: Changelog

on:
  push:
    branches: [master]

concurrency:
  group: changelog-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCT: geiger-dash

jobs:
  changelog:
    if: ${{ !github.event.deleted && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog entry
        env:
          INGEST_SECRET: ${{ secrets.CHANGELOG_INGEST_SECRET }}
          DASH_URL: ${{ vars.GEIGER_DASH_URL || 'https://geiger.studio' }}
        run: |
          if [ -z "$INGEST_SECRET" ]; then
            echo "::warning::CHANGELOG_INGEST_SECRET is not set; skipping changelog."
            exit 0
          fi

          # Diff the whole push so the LLM sees what changed, not just the commit messages.
          BEFORE=$(jq -r '.before' "$GITHUB_EVENT_PATH")
          AFTER=$(jq -r '.after' "$GITHUB_EVENT_PATH")
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-status -M "$BEFORE" "$AFTER" > name-status.txt
          git diff -M --no-color --diff-filter=d -U1 "$BEFORE" "$AFTER" \
            -- . ':(exclude)**/package-lock.json' ':(exclude)package-lock.json' ':(exclude)**/*.lock' \
            | head -c 3000000 > patch.diff

          jq --arg product "$PRODUCT" --rawfile nameStatus name-status.txt --rawfile patch patch.diff '{
            product: $product,
            repo: .repository.full_name,
            branch: (.ref | sub("^refs/heads/"; "")),
            headSha: .after,
            commits: [.commits[] | {id, message, timestamp, author: {name: .author.name}}],
            nameStatus: $nameStatus,
            patch: $patch
          }' "$GITHUB_EVENT_PATH" > payload.json

          if [ "$(jq '.commits | length' payload.json)" -eq 0 ]; then
            echo "No commits in this push."
            exit 0
          fi

          # Retry 404/5xx for a few minutes: the dash may still be deploying when this push lands.
          for attempt in 1 2 3 4 5 6 7 8; do
            status=$(curl --silent --show-error --max-time 150 -o result.json -w '%{http_code}' \
              -X POST "$DASH_URL/api/changelog/ingest" \
              -H "Authorization: Bearer $INGEST_SECRET" \
              -H "Content-Type: application/json" \
              --data @payload.json || echo 000)
            echo "Attempt $attempt: HTTP $status"
            case "$status" in
              2??) break ;;
              404|000|5??) [ "$attempt" -lt 8 ] && sleep 30 ;;
              *) cat result.json; exit 1 ;;
            esac
          done
          cat result.json; echo
          case "$status" in 2??) ;; *) exit 1 ;; esac

          {
            echo "### Changelog"
            jq -r 'if .status == "created"
              then "Published **v\(.version)**: \(.title) (\(.category), \(.items) items from \(.commits) commits)"
              else "Skipped: \(.reason)" end' result.json
          } >> "$GITHUB_STEP_SUMMARY"
