# Publishes a changelog entry for every push through the Geiger Dash changelog service.
# Other product repos keep the same file but call
# bhargavjoshi1237/geiger-dash/.github/workflows/changelog-service.yml@master with their own product slug.
name: Changelog

on:
  push:
    branches: [master]

concurrency:
  group: changelog-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changelog:
    uses: ./.github/workflows/changelog-service.yml
    with:
      product: geiger-dash
    secrets:
      CHANGELOG_INGEST_SECRET: ${{ secrets.CHANGELOG_INGEST_SECRET }}
